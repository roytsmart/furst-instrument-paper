name: overleaf

# Export the section and deliver it to the manuscript.
#
# On a release, the exported files are attached to it and pushed to the
# Overleaf project, so that a release is the moment the section is handed
# over and the tag records exactly which model produced it.
# The workflow can also be run by hand, to deliver without cutting a version.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deliver:
    name: Export the section and deliver it
    runs-on: ubuntu-latest
    steps:
      - name: Install the cairo library
        # optika depends on rlPyCairo, whose pycairo wheel is built from
        # source on Linux and needs the cairo headers.
        run: >-
          sudo apt-get update -o DPkg::Lock::Timeout=300 &&
          sudo apt-get install -y -o DPkg::Lock::Timeout=300 libcairo2-dev

      - uses: actions/checkout@v4
        with:
          # setuptools-scm reads the version from the tags
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e .

      - name: Export the section
        run: |
          python -c "import furst_instrument_paper; furst_instrument_paper.export('export')"
          ls -R export

      - name: Name this delivery
        id: delivery
        # The tag of the release, or the commit when run by hand, so that the
        # commit in the Overleaf project says where its contents came from.
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach the section to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -r section.zip export
          gh release upload "${{ github.event.release.tag_name }}" section.zip --clobber

      - name: Look for the Overleaf credentials
        id: overleaf
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
        # A fork, or a repository whose secrets have not been set, exports
        # the section and stops there rather than failing.
        run: |
          if [ -n "$OVERLEAF_TOKEN" ] && [ -n "$OVERLEAF_PROJECT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OVERLEAF_TOKEN or OVERLEAF_PROJECT_ID is not set; not delivering to Overleaf."
          fi

      - name: Deliver the section to the Overleaf project
        if: steps.overleaf.outputs.available == 'true'
        env:
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
          DELIVERY: ${{ steps.delivery.outputs.name }}
        # The project is cloned fresh every time, since Overleaf refuses a
        # push which is not a fast-forward, and only the files this package
        # owns are written: the section, its bibliography, and the figures.
        run: |
          git clone --depth 1 \
            "https://git:${OVERLEAF_TOKEN}@git.overleaf.com/${OVERLEAF_PROJECT_ID}" \
            overleaf
          cp -r export/. overleaf/
          cd overleaf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "The manuscript already has this version of the section."
            exit 0
          fi
          git commit -m "Optical performance section from furst-instrument-paper ${DELIVERY}"
          git push
